<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Match Center</title>
    <link rel="icon" type="image/svg+xml" href="/webhook/favicon.svg">
    <link rel="stylesheet" href="/webhook/style.css">
    <script src="/webhook/js/http.js"></script>
    <script src="/webhook/js/ui.js"></script>
</head>
<body>
    <div id="soccer-match" class="container">
        <div id="toastArea"></div>

        <div class="theme-toggle" id="themeToggle" title="Switch Theme">
            <span id="themeIcon">☀️</span>
        </div>

        <div id="updateHeaderArea" class="header"></div>

        <div id="updateTopNavArea" class="top-nav-bar" style="display: none;"></div>

        <div id="sessionExpiredBanner"></div>

        <div id="dateInfoCard" class="card info-card" style="display: none;"></div>

        <div id="pitchModalBackdrop"></div>

        <div id="rosterLockedArea" class="roster-locked-container" style="display: none;"></div>

        <div id="stadiumCardWrap" style="display: none;">
            <div id="stadiumScoreboardArea"></div>
            <div id="classicGoalFormArea"></div>
            <div id="stadiumPitchArea"></div>
            <div id="loanPoolPanel" class="loan-pool-panel" style="display: none;">
                <div class="loan-pool-header">
                    <div class="loan-pool-title">
                        <span>🤝 ยืมตัวนักเตะจากทีมอื่น (Loan Pool)</span>
                        <span id="loanPoolCountBadge" class="loan-pool-count">0 คน</span>
                    </div>
                    <input type="text" id="loanSearchInput" class="loan-search-input" placeholder="🔍 ค้นหาชื่อเล่น, ชื่อ, ตำแหน่ง...">
                </div>
                <div id="loanFilterChips" class="loan-filter-chips"></div>
                <div id="loanPlayerGrid" class="loan-player-grid"></div>
            </div>
            <div id="matchTimelineArea"></div>
        </div>

        <div id="emptyMatchesCard" style="display: none;"></div>

        <div id="teamSummaryCard" class="card team-summary-card" style="display: none;"></div>

        <div id="standingsCard" class="card" style="display: none;"></div>

        <div id="matchListArea" style="display: none;"></div>

        <div id="weekPickerModalArea"></div>
        <div id="deleteModalArea"></div>
        <div id="passwordModalArea"></div>
        <div id="addMatchModalArea"></div>
        <div id="extendModalArea"></div>
        <div id="pickerModalArea"></div>
    </div>

    <script src="/webhook/js/update.js"></script>
</body>
</html>
