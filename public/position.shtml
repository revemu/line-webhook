<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>Position Manager - Soccer Bot</title>
	<link rel="icon" type="image/svg+xml" href="/webhook/favicon.svg">
	<link rel="shortcut icon" href="/webhook/favicon.svg">
	<link rel="stylesheet" href="style.css?v=0.7.26">
	<script>
		(function () {
			if (window.history && window.history.replaceState) {
				try {
					var u = new URL(window.location.href);
					var urlChanged = false;
					if (u.searchParams.has('_v')) {
						u.searchParams.delete('_v');
						urlChanged = true;
					}
					if (u.searchParams.has('openExternalBrowser')) {
						u.searchParams.delete('openExternalBrowser');
						urlChanged = true;
					}
					if (urlChanged) {
						var cleanSearch = u.searchParams.toString();
						var cleanUrl = u.pathname + (cleanSearch ? '?' + cleanSearch : '') + u.hash;
						window.history.replaceState(null, '', cleanUrl);
					}
				} catch (e) {}
			}
			var saved = localStorage.getItem('theme');
			var isDark = saved ? (saved === 'dark') : true;
			if (isDark) {
				document.documentElement.setAttribute('data-theme', 'dark');
				document.documentElement.classList.add('dark-theme');
			} else {
				document.documentElement.setAttribute('data-theme', 'light');
				document.documentElement.classList.remove('dark-theme');
			}
		})();
	</script>
	<style>
		/* Swap Mode & Player Action Modal Styles */
		.swap-floating-bar {
			position: fixed;
			bottom: 1.5rem;
			left: 50%;
			transform: translateX(-50%);
			z-index: 2500;
			background: rgba(17, 24, 39, 0.95);
			backdrop-filter: blur(8px);
			border: 2px solid #3b82f6;
			box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 20px rgba(59, 130, 246, 0.4);
			border-radius: 9999px;
			padding: 0.5rem 1.15rem;
			color: #ffffff;
			max-width: 90vw;
			animation: floatBounce 0.25s ease-out;
		}
		@keyframes floatBounce {
			from { opacity: 0; transform: translate(-50%, 20px); }
			to { opacity: 1; transform: translate(-50%, 0); }
		}
		.swap-bar-content { display: flex; align-items: center; gap: 0.85rem; }
		.swap-bar-info { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; }
		.swap-bar-badge {
			background: #3b82f6; color: #fff; padding: 0.2rem 0.55rem; border-radius: 9999px;
			font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
		}
		.swap-bar-hint { color: #93c5fd; font-size: 0.8rem; }
		.swap-bar-cancel-btn {
			background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #fca5a5;
			padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 700;
			cursor: pointer; transition: all 0.15s ease;
		}
		.swap-bar-cancel-btn:hover { background: #ef4444; color: #ffffff; }
		.pitch-circle-avatar.is-swap-source,
		.unassigned-card.is-swap-source,
		.pitch-player-card.is-swap-source {
			box-shadow: 0 0 0 4px #3b82f6, 0 0 20px rgba(59, 130, 246, 0.9) !important;
			animation: swapPulse 1.2s infinite alternate ease-in-out;
			transform: scale(1.08);
		}
		@keyframes swapPulse {
			from { box-shadow: 0 0 0 3px #3b82f6, 0 0 10px rgba(59, 130, 246, 0.6); }
			to { box-shadow: 0 0 0 5px #60a5fa, 0 0 24px rgba(96, 165, 250, 0.95); }
		}
		.swap-mode-active .pitch-circle-avatar:not(.is-swap-source):not(.is-empty),
		.swap-mode-active .unassigned-card:not(.is-swap-source),
		.swap-mode-active .pitch-player-card:not(.is-swap-source) {
			cursor: pointer !important;
			border: 2px dashed #60a5fa !important;
			animation: subtlePulse 2s infinite ease-in-out;
		}
		@keyframes subtlePulse {
			0%, 100% { opacity: 1; }
			50% { opacity: 0.85; }
		}
		.swap-mode-active .pitch-circle-slot { cursor: pointer !important; }
		.swap-mode-active .pitch-circle-avatar.is-empty {
			border: 2px dashed #10b981 !important;
			background: rgba(16, 185, 129, 0.2) !important;
			cursor: pointer !important;
		}
		.player-action-modal { max-width: 480px; padding: 1.25rem; border-radius: 1rem; }
		.action-modal-header {
			display: flex; align-items: center; justify-content: space-between;
			border-bottom: 1px solid var(--border-color); padding-bottom: 0.85rem; margin-bottom: 1rem;
		}
		.action-player-profile { display: flex; align-items: center; gap: 0.75rem; }
		.action-player-avatar {
			width: 48px; height: 48px; border-radius: 50%; overflow: hidden;
			border: 2px solid var(--border-color); background: var(--card-bg);
			display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.15rem;
		}
		.action-player-avatar img { width: 100%; height: 100%; object-fit: cover; }
		.action-player-name { font-size: 1.15rem; font-weight: 800; color: var(--text-main); }
		.action-player-meta { display: flex; align-items: center; gap: 0.35rem; margin-top: 3px; }
		.action-badge-team { padding: 1px 7px; border-radius: 9999px; font-size: 0.72rem; font-weight: 700; }
		.action-badge-pos { background: rgba(79, 70, 229, 0.12); color: var(--primary-color); padding: 1px 6px; border-radius: 9999px; font-size: 0.72rem; font-weight: 700; }
		.action-badge-rating { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
		.action-modal-close { background: none; border: none; font-size: 1.6rem; color: var(--text-muted); cursor: pointer; line-height: 1; }
		.action-section { margin-bottom: 1rem; }
		.action-section-title { font-size: 0.78rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
		.btn-action-swap-mode {
			width: 100%; display: flex; align-items: center; gap: 0.75rem;
			background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(99, 102, 241, 0.15));
			border: 1.5px solid #3b82f6; border-radius: 0.75rem; padding: 0.75rem 1rem;
			cursor: pointer; text-align: left; color: var(--text-main); transition: all 0.15s ease;
		}
		.btn-action-swap-mode:hover { background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(99, 102, 241, 0.25)); border-color: #2563eb; transform: translateY(-1px); }
		.action-pos-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.45rem; }
		.action-pos-btn {
			display: flex; flex-direction: column; align-items: center; justify-content: center;
			padding: 0.5rem 0.25rem; border-radius: 0.6rem; border: 1px solid var(--border-color);
			background: var(--card-bg); cursor: pointer; transition: all 0.15s ease; color: var(--text-main);
		}
		.action-pos-btn:hover { border-color: var(--primary-color); background: rgba(79, 70, 229, 0.08); }
		.action-pos-btn.active { border-color: var(--primary-color); background: var(--primary-color); color: #ffffff; }
		.action-pos-btn.active .action-pos-name { color: rgba(255, 255, 255, 0.85); }
		.action-pos-icon { font-size: 1.1rem; }
		.action-pos-code { font-weight: 800; font-size: 0.8rem; margin-top: 1px; }
		.action-pos-name { font-size: 0.65rem; color: var(--text-muted); }
		.action-team-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.45rem; }
		.action-team-btn {
			display: flex; align-items: center; gap: 0.45rem; padding: 0.55rem 0.65rem;
			border-radius: 0.6rem; border: 1px solid var(--border-color); border-left-width: 4px;
			background: var(--card-bg); color: var(--text-main); font-size: 0.82rem; font-weight: 600;
			cursor: pointer; transition: all 0.15s ease;
		}
		.action-team-btn:hover { border-color: var(--primary-color); background: rgba(79, 70, 229, 0.08); }
		.action-team-btn.active { background: rgba(79, 70, 229, 0.15); border-color: var(--primary-color); font-weight: 800; }
		.action-team-count { margin-left: auto; font-size: 0.72rem; color: var(--text-muted); }
		.slot-picker-row {
			display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0.65rem;
			border-radius: 0.5rem; border: 1px solid var(--border-color); background: var(--card-bg);
			cursor: pointer; transition: all 0.15s ease;
		}
		.slot-picker-row:hover { border-color: var(--primary-color); background: rgba(79, 70, 229, 0.08); }
		.multi-pitch-grid.cols-1 { grid-template-columns: minmax(0, 1fr) !important; }
		@media (max-width: 1024px) {
			.multi-pitch-grid { grid-template-columns: minmax(0, 1fr) !important; }
		}
		.team-pitch-card { width: 100%; max-width: 100%; min-width: 0; overflow: hidden; }
		.tactical-pitch-scroll-wrapper {
			width: 100%; max-width: 100%; min-width: 0; overflow-x: auto;
			-webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
			touch-action: pan-x pan-y; border-radius: 0.85rem; position: relative; cursor: grab;
		}
		.tactical-pitch-scroll-wrapper.is-panning { cursor: grabbing; }
		@media (max-width: 768px) {
			.desktop-only-control { display: none !important; }
			#position-app .team-quota-chips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0.2rem; margin-top: 0.15rem; }
			#position-app .team-quota-chips .quota-chip { font-size: 0.62rem; padding: 0.14rem 0.1rem; text-align: center; border-radius: 0.28rem; letter-spacing: -0.02em; white-space: nowrap; }
			#position-app .pitch-scroll-hint { display: inline-flex; margin-left: auto; font-size: 0.66rem; }
		}
	</style>
</head>

<body>
	<div id="position-app" class="container">
		<div id="themeToggle" class="theme-toggle" title="Switch to Light Mode">
			<span id="themeIcon">☀️</span>
		</div>

		<div id="fullscreenToggle" class="fullscreen-toggle" title="ขยายเต็มหน้าจอ (Full Screen)">
			<span id="fullscreenIcon">⛶</span>
		</div>

		<div id="posHeaderArea" class="header" style="margin-top: 0.5rem;"></div>
		<div id="posTopNavArea" class="top-nav-bar"></div>
		<div id="posDateCardArea" class="card pos-date-card"></div>
		<div id="posSaveBarArea" class="save-action-bar"></div>
		<div id="unassignedPanel" class="unassigned-panel"></div>
		<div id="multiPitchGrid" class="multi-pitch-grid"></div>

		<div id="listViewCard" class="card" style="padding: 1rem; display: none;">
			<div class="filter-bar">
				<input id="playerSearchInput" type="text" class="search-input" placeholder="🔍 Search player by name or alias...">
				<div id="listTeamFilters" class="team-filter-scroll"></div>
			</div>
			<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">
				<span id="listPlayersCount">Players (0)</span>
				<span id="listLoadingText" style="display: none;">⏳ Loading...</span>
			</div>
			<div id="listPlayersGrid" class="player-list-grid"></div>
		</div>

		<div id="swapFloatingBarArea"></div>
		<div id="posModalsArea"></div>
		<div id="posToastArea"></div>
	</div>

	<script src="/webhook/js/http.js"></script>
	<script src="/webhook/js/ui.js"></script>
	<script src="/webhook/js/position.js"></script>
</body>

</html>
